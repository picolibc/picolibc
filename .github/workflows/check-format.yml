name: Check Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: read

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOCKERFILE: picolibc/.github/Dockerfile-check-format
  IMAGE_FILE: dockerimg-check-format.tar.zst
  IMAGE: picolibc-check-format
  PACKAGES_FILE: picolibc/.github/check-format-packages.txt
  EXTRA_FILE: picolibc/.github/check-format-files.txt
  BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  AFTER_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

jobs:
  cache-maker:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      image-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Clone picolibc
        uses: actions/checkout@v7
        with:
          path: picolibc

      - name: Compute the Docker Image cache key
        id: key
        run: echo "key=${{ env.IMAGE_FILE }}-${{ hashFiles( env.DOCKERFILE, env.PACKAGES_FILE, env.EXTRA_FILE ) }}" >> "$GITHUB_OUTPUT"

      - name: Cache the Docker Image
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.IMAGE_FILE }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # A scheduled run only refreshes main's cache entry, so it isn't
      # evicted while PRs still need it; restoring it updates its
      # last-access time, which a lookup doesn't.
      - name: Refresh the Docker Image cache entry
        if: github.event_name == 'schedule' && steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.IMAGE_FILE }}
          key: ${{ steps.key.outputs.key }}

      - name: Set up Docker Buildx
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build picolibc container
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          file: .github/Dockerfile-check-format
          tags: ${{ env.IMAGE }}:latest
          outputs: type=docker,force-compression=true,compression=zstd,compression-level=22,dest=${{ env.IMAGE_FILE }}

      - name: Delete stale Docker Image caches from main
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          gh cache list --ref refs/heads/main --key "$IMAGE_FILE-" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | .id" | xargs -r -n1 gh cache delete

  check-format:
    needs: cache-maker
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Clone picolibc
        uses: actions/checkout@v7
        with:
          path: picolibc
          fetch-depth: 1

      - name: Restore the Docker Image
        uses: actions/cache@v6
        with:
          path: ${{ env.IMAGE_FILE }}
          key: ${{ needs.cache-maker.outputs.image-key }}
          fail-on-cache-miss: true

      - name: Load and Check the Docker Image
        run: |
          docker load -i $IMAGE_FILE
          docker images -a $IMAGE

          
      - name: Check Formatting
        run: |
          docker run -v $(readlink -f picolibc):/picolibc -e DOCKERFILE -e PACKAGES_FILE -e EXTRA_FILE -e BEFORE_SHA -e AFTER_SHA -w /picolibc $IMAGE bash --login -c "./.github/do-check-format"

      - name: Upload Formatting Patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clang-format-fix
          path: picolibc/clang-format.patch
